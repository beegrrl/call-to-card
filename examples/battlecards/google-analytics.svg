<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420" role="img" font-family="'Atkinson Hyperlegible', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Google Analytics battlecard</title>
  <desc>Top objection: too many products. Answer: No, and most teams don&apos;t. You want one thing, a funnel on your onboarding steps, so ignore the rest of the site until you have a question that funnel can&apos;t answer.</desc>
  <rect x="4" y="4" width="292" height="412" rx="18" fill="#FFFDF7" stroke="#1F2328" stroke-width="3"/>
  <rect x="22" y="22" width="256" height="376" rx="10" fill="none" stroke="#1F2328" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="34" y="60" font-size="34" font-weight="700" fill="#1F2328">G</text><text x="35" y="90" font-size="26" fill="#1F2328">♣</text>
  <g transform="rotate(180 150 210)"><text x="34" y="60" font-size="34" font-weight="700" fill="#1F2328">G</text><text x="35" y="90" font-size="26" fill="#1F2328">♣</text></g>
  <text x="150" y="152" font-size="72" text-anchor="middle" fill="#1F2328">♣</text>
  <text x="150" y="200" font-size="20" font-weight="700" text-anchor="middle" fill="#1F2328">Google Analytics</text>
  <text x="150" y="224" font-size="11" letter-spacing="1" text-anchor="middle" fill="#1F2328">TOP OBJECTION: TOO MANY PRODUCTS</text>
  <line x1="70" y1="240" x2="230" y2="240" stroke="#1F2328" stroke-opacity="0.5"/>
  <text x="150" y="264" font-size="14" text-anchor="middle" fill="#1F2328"><tspan x="150" dy="0">No, and most teams don&apos;t.</tspan><tspan x="150" dy="20">You want one thing, a</tspan><tspan x="150" dy="20">funnel on your onboarding</tspan><tspan x="150" dy="20">steps, so ignore the rest…</tspan></text>
