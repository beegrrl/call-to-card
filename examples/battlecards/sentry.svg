  <text x="150" y="264" font-size="14" text-anchor="middle" fill="#1F2328"><tspan x="150" dy="0">Agreed, and I&apos;m not asking</tspan><tspan x="150" dy="20">you to replace it. The</tspan><tspan x="150" dy="20">question is whether Sentry</tspan><tspan x="150" dy="20">tells you which errors…</tspan></text>
